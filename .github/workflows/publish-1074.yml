name: Publish 1.0.74

on:
  push:
    branches:
      - "ops/publish-1.0.74-draft"
    paths:
      - ".github/workflows/publish-1074.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          json="$(gh release view v1.0.74 -R "${{ github.repository }}" --json isDraft,assets)"
          test "$(printf '%s' "$json" | jq -r '.isDraft')" = "true"
          test "$(printf '%s' "$json" | jq '.assets | length')" = "3"
          test "$(printf '%s' "$json" | jq -r '.assets[] | select(.name=="Coffee-Fidelity-Stock-Setup-1.0.74.exe") | .size')" = "170554358"
          test "$(printf '%s' "$json" | jq -r '.assets[] | select(.name=="Coffee-Fidelity-Stock-Setup-1.0.74.exe.blockmap") | .size')" = "179402"
          test "$(printf '%s' "$json" | jq -r '.assets[] | select(.name=="latest.yml") | .name')" = "latest.yml"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit v1.0.74 -R "${{ github.repository }}" --draft=false
          test "$(gh release view v1.0.74 -R "${{ github.repository }}" --json isDraft --jq .isDraft)" = "false"
          echo "UPDATER_1_0_74_PUBLISHED=OK"
