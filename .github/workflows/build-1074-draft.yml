name: Build 1.0.74 draft

on:
  push:
    branches:
      - "ops/publish-1.0.74"
    paths:
      - ".github/workflows/build-1074-draft.yml"

permissions:
  contents: write

jobs:
  build-draft:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout updates repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Clone exact source main
        shell: pwsh
        run: |
          git clone --branch main --single-branch https://github.com/newyogurt/coffee-fidelity-stock.git source
          $expected = "2f8d48afd9550c13c3e817e592f886d7e4b91b27"
          $head = git -C source rev-parse HEAD
          if ($head -ne $expected) { throw "Source main inattesa: $head; attesa $expected" }
          $version = node -p "require('./source/package.json').version"
          if ($version -ne "1.0.74") { throw "Versione source inattesa: $version" }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install source dependencies
        working-directory: source
        run: npm ci

      - name: Recover current production Supabase key
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "Coffee-Fidelity-Stock-Setup-1.0.73.exe"
          $outer = Join-Path $env:RUNNER_TEMP "prev-outer"
          $innerRoot = Join-Path $env:RUNNER_TEMP "prev-inner"
          $asarOut = Join-Path $env:RUNNER_TEMP "prev-asar"

          Invoke-WebRequest -Uri "https://github.com/newyogurt/coffee-fidelity-stock-updates/releases/download/v1.0.73/Coffee-Fidelity-Stock-Setup-1.0.73.exe" -OutFile $installer

          New-Item -ItemType Directory -Force -Path $outer | Out-Null
          $sevenZip = node -p "require('7zip-bin').path7za"
          & $sevenZip x $installer "-o$outer" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Estrazione installer 1.0.73 fallita." }

          $appAsar = Get-ChildItem -Path $outer -Recurse -Filter "app.asar" -File -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $appAsar) {
            $archives = Get-ChildItem -Path $outer -Recurse -Filter "*.7z" -File -ErrorAction SilentlyContinue
            $i = 0
            foreach ($archive in $archives) {
              $i += 1
              $inner = Join-Path $innerRoot $i
              New-Item -ItemType Directory -Force -Path $inner | Out-Null
              & $sevenZip x $archive.FullName "-o$inner" -y | Out-Null
              if ($LASTEXITCODE -ne 0) { continue }

              $appAsar = Get-ChildItem -Path $inner -Recurse -Filter "app.asar" -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($appAsar) { break }
            }
          }

          if (-not $appAsar) { throw "app.asar non trovato nell'installer ufficiale 1.0.73." }

          New-Item -ItemType Directory -Force -Path $asarOut | Out-Null
          $env:OLD_ASAR = $appAsar.FullName
          $env:OLD_ASAR_OUT = $asarOut

          @'
          const fs = require("fs");
          const path = require("path");
          const asar = require("@electron/asar");

          asar.extractAll(process.env.OLD_ASAR, process.env.OLD_ASAR_OUT);

          const allowed = new Set([".js", ".cjs", ".mjs", ".json", ".html"]);
          const candidates = new Set();
          const deliveryKeys = new Set();

          function scan(dir, deliveryPass) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                scan(full, deliveryPass);
                continue;
              }
              if (!allowed.has(path.extname(entry.name).toLowerCase())) continue;

              let body;
              try { body = fs.readFileSync(full, "utf8"); } catch { continue; }

              if (deliveryPass) {
                for (const m of body.matchAll(/deliverySupabasePublishableKey\s*:\s*["']([^"']+)["']/g)) {
                  deliveryKeys.add(m[1]);
                }
              } else {
                for (const m of body.matchAll(/sb_publishable_[A-Za-z0-9_-]{20,}/g)) {
                  const key = m[0];
                  if (!deliveryKeys.has(key) && !key.includes("compile_only")) candidates.add(key);
                }
                for (const m of body.matchAll(/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g)) {
                  candidates.add(m[0]);
                }
              }
            }
          }

          scan(process.env.OLD_ASAR_OUT, true);
          scan(process.env.OLD_ASAR_OUT, false);

          fs.writeFileSync(
            path.join(process.env.RUNNER_TEMP, "key-candidates.txt"),
            [...candidates].join("\n"),
            "utf8"
          );
          console.log("Candidate recuperate: " + candidates.size + " (valori non mostrati).");
          '@ | node

          $identityPath = Join-Path $asarOut "dist\store-build-identity.json"
          if (-not (Test-Path $identityPath)) { throw "Identita build 1.0.73 non trovata." }

          $identity = Get-Content $identityPath -Raw | ConvertFrom-Json
          if ($identity.storeId -ne "caffe-e-delizie") { throw "Store identity inattesa: $($identity.storeId)" }
          if ($identity.supabaseProjectRef -ne "kktgdntndccxcfnlrlxj") { throw "Project ref inatteso: $($identity.supabaseProjectRef)" }

          $candidates = @(Get-Content (Join-Path $env:RUNNER_TEMP "key-candidates.txt") | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($candidates.Count -ne 1) { throw "Chiave produzione non identificata in modo univoco. Candidate: $($candidates.Count)." }

          $key = $candidates[0]
          Write-Host "::add-mask::$key"
          "STORE_PRODUCTION_KEY=$key" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create exact store environment
        shell: pwsh
        working-directory: source
        run: |
          @(
            "VITE_SUPABASE_URL=https://kktgdntndccxcfnlrlxj.supabase.co"
            "VITE_SUPABASE_PUBLISHABLE_KEY=$env:STORE_PRODUCTION_KEY"
          ) | Set-Content -Path ".env.store.caffe-e-delizie.local" -Encoding utf8

          npm run store:env:check:caffe
          if ($LASTEXITCODE -ne 0) { throw "Gate ambiente produzione fallito." }

      - name: Confirm v1.0.74 absent
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.74 *> $null
          if ($LASTEXITCODE -eq 0) { throw "v1.0.74 esiste gia nel repository aggiornamenti." }
          Write-Host "Target v1.0.74 libero."
          exit 0

      - name: Build and upload 1.0.74 draft
        working-directory: source
        run: npm run desktop:release:win:caffe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = gh release view v1.0.74 --json isDraft,assets | ConvertFrom-Json
          if (-not $release.isDraft) { throw "v1.0.74 non e draft dopo upload." }

          $names = @($release.assets | ForEach-Object { $_.name })
          foreach ($required in @("Coffee-Fidelity-Stock-Setup-1.0.74.exe", "Coffee-Fidelity-Stock-Setup-1.0.74.exe.blockmap", "latest.yml")) {
            if ($required -notin $names) { throw "Asset mancante: $required" }
          }

          $temp = Join-Path $env:RUNNER_TEMP "latest-check"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          gh release download v1.0.74 -p "latest.yml" -D $temp --clobber
          $latest = Get-Content (Join-Path $temp "latest.yml") -Raw

          if ($latest -notmatch '(?m)^version:\s*1\.0\.74\s*$') { throw "latest.yml non dichiara 1.0.74." }
          if ($latest -notmatch [regex]::Escape("Coffee-Fidelity-Stock-Setup-1.0.74.exe")) { throw "latest.yml non punta all'installer 1.0.74 atteso." }

          Write-Host "DRAFT_1_0_74_VERIFIED=OK"
