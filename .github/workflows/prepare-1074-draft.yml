name: Prepare 1.0.74 draft

on:
  push:
    branches:
      - "ops/publish-1.0.74-draft"
    paths:
      - ".github/workflows/prepare-1074-draft.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4

      - name: Assert release absent
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.74 -R "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { throw "v1.0.74 esiste gia." }
          exit 0

      - name: Download verified 1.0.74 artifact
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "release-1.0.74.zip"
          Invoke-WebRequest -Uri "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-3cec-820a-820f-f8c15fa99d7e/raw?se=2026-10-07T14%3A01%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=e05e068a-77c0-5415-819e-188041555453&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T00%3A52%3A50Z&ske=2026-10-08T00%3A52%3A50Z&sks=b&skv=2026-02-06&sig=W47kMkET6MqlaCW4AB5cupeMnROUdiMah9drzUtA/Bk%3D" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "release-files" -Force
          if (-not (Test-Path "release-files/Coffee-Fidelity-Stock-Setup-1.0.74.exe")) { throw "Installer verificato mancante." }
          if (-not (Test-Path "release-files/Coffee-Fidelity-Stock-Setup-1.0.74.exe.blockmap")) { throw "Blockmap verificata mancante." }

      - name: Build latest.yml using official previous schema
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path "previous" | Out-Null
          gh release download v1.0.73 -R "${{ github.repository }}" -p "latest.yml" -D "previous" --clobber
          $template = Get-Content "previous/latest.yml" -Raw

          foreach ($needle in @("version:", "files:", "url:", "sha512:", "size:", "path:", "releaseDate:")) {
            if (-not $template.Contains($needle)) { throw "Schema latest.yml precedente inatteso: manca $needle" }
          }
          if (-not $template.Contains("Coffee-Fidelity-Stock-Setup-1.0.73.exe")) { throw "Schema latest.yml precedente non punta al setup 1.0.73 atteso." }

          $setupPath = (Resolve-Path "release-files/Coffee-Fidelity-Stock-Setup-1.0.74.exe").Path
          $bytes = [System.IO.File]::ReadAllBytes($setupPath)
          $hasher = [System.Security.Cryptography.SHA512]::Create()
          try {
            $sha64 = [Convert]::ToBase64String($hasher.ComputeHash($bytes))
          } finally {
            $hasher.Dispose()
          }
          $size = (Get-Item $setupPath).Length
          $releaseDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")

          $lines = @(
            "version: 1.0.74",
            "files:",
            "  - url: Coffee-Fidelity-Stock-Setup-1.0.74.exe",
            "    sha512: $sha64",
            "    size: $size",
            "path: Coffee-Fidelity-Stock-Setup-1.0.74.exe",
            "sha512: $sha64",
            "releaseDate: '$releaseDate'"
          )
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "release-files/latest.yml"),
            ($lines -join [Environment]::NewLine) + [Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false)
          )

          $check = Get-Content "release-files/latest.yml" -Raw
          if ($check -notmatch '(?m)^version:\s*1\.0\.74\s*$') { throw "latest.yml 1.0.74 non valido." }
          if (-not $check.Contains("Coffee-Fidelity-Stock-Setup-1.0.74.exe")) { throw "latest.yml non punta al nuovo setup." }

      - name: Create verified draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.74 -R "${{ github.repository }}" --title "Caffè e Delizie 1.0.74" --draft "release-files/Coffee-Fidelity-Stock-Setup-1.0.74.exe" "release-files/Coffee-Fidelity-Stock-Setup-1.0.74.exe.blockmap" "release-files/latest.yml"
          if ($LASTEXITCODE -ne 0) { throw "Creazione draft v1.0.74 fallita." }

      - name: Verify draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $r = gh release view v1.0.74 -R "${{ github.repository }}" --json isDraft,assets | ConvertFrom-Json
          if (-not $r.isDraft) { throw "v1.0.74 non e draft." }
          $names = @($r.assets | ForEach-Object { $_.name })
          foreach ($required in @("Coffee-Fidelity-Stock-Setup-1.0.74.exe", "Coffee-Fidelity-Stock-Setup-1.0.74.exe.blockmap", "latest.yml")) {
            if ($required -notin $names) { throw "Asset draft mancante: $required" }
          }
          if (@($r.assets).Count -ne 3) { throw "Numero asset inatteso: $(@($r.assets).Count)" }
          Write-Host "DRAFT_1_0_74_VERIFIED=OK"
